<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFZ Command Center - Admin Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 400px;
        }

        .afz-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .btn-primary {
            background: #1e3c72;
            border: none;
            width: 100%;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="afz-header">
            <h2>🔐 AFZ Command Center</h2>
            <p>Top Secret Access Required</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary">Access Command Center</button>
        </form>
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} mt-3">{{ message }}</div>
        {% endfor %}
        {% endif %}
    </div>
</body>

</html>
