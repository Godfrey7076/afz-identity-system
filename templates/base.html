<nav class="navbar">
    <div class="navbar-brand">
        Air Force of Zimbabwe - Identity Verification System
    </div>
    <ul class="navbar-nav">
        <li><a href="/">Home</a></li>
        
        {% if user.is_authenticated and user.is_staff %}
            <!-- Show dashboard links for logged-in staff -->
            <li><a href="/verification/dashboard/" {% if request.path == '/verification/dashboard/' %}class="active"{% endif %}>Dashboard</a></li>
            <li><a href="/verification/user-management/" {% if request.path == '/verification/user-management/' %}class="active"{% endif %}>User Management</a></li>

            <li><a href="/admin/">Admin Panel</a></li>
            <li><a href="/verification/admin-logout/">Logout ({{ user.username }})</a></li>
        {% else %}

            <li><a href="/verification/admin-login/">Staff Login</a></li>
            <li><a href="/verification/login/">Face Login</a></li>
            <li><a href="/admin/">Admin</a></li>
